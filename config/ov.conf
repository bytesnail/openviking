{
  "storage": {
    "workspace": "./data"
  },
  "embedding": {
    "max_concurrent": 2,
    "max_retries": 3,
    "max_input_tokens": 4096,
    "dense": {
      "provider": "openai",
      "model": "embeddinggemma-2",
      "api_base": "http://127.0.0.1:18353/v1",
      "api_key": "local-not-used",
      "dimension": 768,
      "input": "multimodal",
      "encoding_format": "float"
    }
  },
  "vlm": {
    "provider": "glm",
    "model": "glm-5.3-flash",
    "api_base": "https://api.z.ai/api/coding/paas/v4",
    "api_key": "${Z_AI_API_KEY}",
    "max_concurrent": 2,
    "max_retries": 3,
    "timeout": 600
  },
  "rerank": {
    "provider": "openai",
    "model": "qwen3-vl-reranker-2b",
    "api_base": "http://127.0.0.1:18352/v1/rerank",
    "api_key": "local-not-used",
    "timeout": 60,
    "max_input_tokens": 4096,
    "threshold": 0.1,
    "log_payloads": false
  },
  "server": {
    "host": "127.0.0.1",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}"
  }
}
