name: openviking

x-openviking-image: &openviking-image
  ghcr.io/volcengine/openviking:v0.5.2.1@sha256:7c26f9777c7632fd4b771be77471634bffb6ec8d6338b39f53deb2da1b1d34b3

services:
  embedding-adapter:
    image: *openviking-image
    network_mode: host
    user: "65532:65532"
    entrypoint: ["python", "-I", "-B", "/opt/openviking/scripts/embedding_adapter.py"]
    environment:
      EMBEDDING_ADAPTER_HOST: "127.0.0.1"
      EMBEDDING_ADAPTER_PORT: "18353"
      EMBEDDING_UPSTREAM_URL: "http://127.0.0.1:18351/v1/embeddings"
      EMBEDDING_UPSTREAM_TIMEOUT_SECONDS: "120"
      EMBEDDING_MAX_BODY_BYTES: "67108864"
      EMBEDDING_MAX_CONCURRENT: "2"
    volumes:
      - ./scripts:/opt/openviking/scripts:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # liveness 只量测适配器进程自身(/health):/ready 含上游探活,若用作
      # healthcheck,model-serving(18351)停滞时会把适配器拖进无意义的重启
      # 循环——重启救不了上游。上游可用性由验收命令(doctor/smoke/e2e 探针)
      # 与 /ready 人工诊断承担;depends_on 的启动门禁因此只保证适配器在位
      # (2026-11-03 检视决策,用户批准)。
      test:
        - CMD
        - curl
        - -fsS
        - --max-time
        - "4"
        - -o
        - /dev/null
        - http://127.0.0.1:18353/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  openviking:
    image: *openviking-image
    network_mode: host
    user: "1000:1000"
    env_file:
      - ./secrets.env
    environment:
      OPENVIKING_SERVER_HOST: "127.0.0.1"
      OPENVIKING_SERVER_PORT: "1933"
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_CONFIG_FILE: "/app/.openviking/ov.conf"
      OPENVIKING_CLI_CONFIG_FILE: "/app/.openviking/ovcli.conf"
    volumes:
      - ./state:/app/.openviking
      - ./config/ov.conf:/app/.openviking/ov.conf:ro
      - ./scripts:/opt/openviking/scripts:ro
      - ./tests/fixtures:/opt/openviking/fixtures:ro
    # 与 embedding-adapter 对齐的降权基线(2026-11-07 用户批准):uid 1000 直接
    # exec 使 CapEff/CapPrm 本就为空,此处清空能力包围集并封 setuid/file-caps
    # 提权路径;/tmp 加 noexec,nosuid 与容量上限,亦为将来 read_only 留前置。
    # read_only 因 entrypoint 未知写路径暂缓,待实证后再启用。
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      embedding-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # restart-on-unhealthy 有意保持现状(2026-11-06 用户决策):Docker/Compose
    # 原生无按健康状态重启;autoheal 需挂 docker.sock(root 等价权限),对收紧的
    # loopback 单机部署得不偿失。挂死(unhealthy running)由巡检/验收发现,
    # 人工 docker compose down 后恢复。
    restart: unless-stopped
